name: Password recovery frontend checks

on:
  pull_request:
    branches: [develop]
    paths:
      - 'frontend/src/screens/Auth/**'
      - 'frontend/src/services/api.client.ts'
      - 'frontend/tests/password-recovery.test.mjs'
      - '.github/workflows/auth-password-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Password recovery focused tests
        run: node --experimental-strip-types --test tests/password-recovery.test.mjs
      - run: npm run build
