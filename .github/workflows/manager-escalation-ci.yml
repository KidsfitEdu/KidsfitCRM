name: Manager proposal escalation checks
on:
  pull_request:
    branches: [develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/manager-escalation-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manager-escalation-migration
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pephemeral-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: "Server=127.0.0.1;Port=3306;Database=kidsfit_crm_test;User ID=root;Password=ephemeral-ci-only;"
      KIDSFIT_TEST_MYSQL_ADMIN: "Server=127.0.0.1;Port=3306;User ID=root;Password=ephemeral-ci-only;SslMode=Disabled;"
      Jwt__Key: "ci-only-ephemeral-signing-key-000000000000000000000"
      Jwt__Issuer: "KidsfitCRM.Api"
      Jwt__Audience: "KidsfitCRM.Web"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore .NET
        run: dotnet restore backend/KidsfitCRM.slnx
      - name: Build without modifying or committing migrations
        run: dotnet build backend/KidsfitCRM.slnx --no-restore
      - name: MySQL 8.4 and .NET regression tests
        run: dotnet test backend/KidsfitCRM.slnx --configuration Release --logger 'console;verbosity=normal'
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build
