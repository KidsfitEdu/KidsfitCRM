name: Frontend refactor validation

on:
  pull_request:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-refactor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:demo
      - run: npm run build
      - run: npm run build:pages
      - run: npm run test:pages
      - name: Install Chromium for browser smoke tests
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.58.2
          npx playwright install chromium
      - name: Verify demo role navigation in Chromium
        run: node --test tests/browser/*.test.mjs
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crm-browser-smoke
          path: frontend/tests/browser/screenshots/
          if-no-files-found: ignore
